services:
  - type: web
    name: naturatins-parecer
    runtime: python
    buildCommand: |
      apt-get update -qq
      apt-get install -y -qq chromium-driver chromium
      pip install -r requirements.txt
    startCommand: >
      gunicorn app:app
      --bind 0.0.0.0:$PORT
      --timeout 120
      --workers 1
      --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: naturatins-db
          property: connectionString
      # ── Gere com: python -c "import secrets; print(secrets.token_hex(64))"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_HORAS
        value: "8"
      # ── URL(s) do seu GitHub Pages (separadas por vírgula)
      - key: ORIGENS_PERMITIDAS
        sync: false
      # ── Conta admin inicial
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA_INICIAL
        sync: false
      # ── SIGCAR e SIGAM
      - key: SIGCAR_USUARIO
        sync: false
      - key: SIGCAR_SENHA
        sync: false
      - key: SIGAM_USUARIO
        sync: false
      - key: SIGAM_SENHA
        sync: false

databases:
  - name: naturatins-db
    databaseName: naturatins
    user: naturatins_user
    plan: free
